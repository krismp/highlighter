[package]
name = "highlighter-desktop"
version = "1.0.0"
description = "Highlighter desktop app"
edition = "2021"
publish = false

[[bin]]
name = "highlighter-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = "=2.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Proc macros and build scripts run on the build machine; stripping their
# dylibs leaves a LINKEDIT layout recent macOS dyld refuses to load.
[profile.release.build-override]
strip = false
