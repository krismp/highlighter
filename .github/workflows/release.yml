# Builds the Highlighter desktop app (Tauri) for macOS (Apple Silicon,
# Intel) and Windows, installs and smoke-tests each on its own kind of
# machine, and on a v* tag publishes the zipped installers as a GitHub
# release. Branch pushes that touch the app (and manual runs) build and test
# only; the zips are kept as workflow artifacts.
#
# In-app updates: with the TAURI_SIGNING_PRIVATE_KEY secret (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, empty for an unprotected key) the builds
# also make signed update files, and the release gets them plus latest.json,
# which installed apps read to update themselves in place.
name: release

on:
  push:
    tags: ["v*"]
    branches-ignore: [main]
    paths: # not applied to tag pushes
      - .github/workflows/release.yml
      - scripts/**
      - packaging/**
      - desktop/**
      - cmd/**
      - internal/**
      - web/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-amd64
            runner: macos-15
          - target: windows-amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no go.sum: the server has no dependencies
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - run: go test ./...
      - run: scripts/package.sh ${{ matrix.target }} ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/Highlighter-*.zip
            dist/updater/
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-amd64
            runner: macos-15-intel
          - target: windows-amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      YOUTUBE_OPTIONAL: "1" # YouTube often blocks datacenter IPs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist
      - run: unzip -q dist/*.zip -d "$RUNNER_TEMP/pkg" && ls -R "$RUNNER_TEMP/pkg"
      - name: Install from the .dmg and test
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/hl "$RUNNER_TEMP"/pkg/*/*.dmg
          cp -R /tmp/hl/Highlighter.app "$RUNNER_TEMP/"
          # Spotlight can still hold a freshly mounted volume ("Resource busy"):
          # retry, then force, since the app has already been copied out.
          for i in 1 2 3; do hdiutil detach /tmp/hl && break; sleep 3; done
          [ ! -d /tmp/hl/Highlighter.app ] || hdiutil detach -force /tmp/hl
          scripts/smoke-test.sh "$RUNNER_TEMP/Highlighter.app"
      # A picture of the installer's first page, to review its look
      # (kept as the "windows-installer-screenshot" artifact).
      - name: Screenshot the installer
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\pkg\*\*-setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -PassThru
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\installer.png")
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        continue-on-error: true
        with:
          name: windows-installer-screenshot
          path: ${{ runner.temp }}/installer.png
      - name: Run the installer silently
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\pkg\*\*-setup.exe" | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S', "/D=$env:RUNNER_TEMP\installed"
          Get-ChildItem "$env:RUNNER_TEMP\installed"
      - name: Test the installed app
        if: runner.os == 'Windows'
        run: scripts/smoke-test.sh "$RUNNER_TEMP/installed"

  release:
    if: github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The tag may come from pushing it, or from creating a release on GitHub
      # (which makes the tag and starts this run): attach the installers to
      # that release instead of failing, and fill in its notes if it has none.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Highlighter-*.zip --clobber
            if [[ -z $(gh release view "$tag" --json body -q .body) ]]; then
              gh release edit "$tag" --notes-file packaging/RELEASE_NOTES.md
            fi
          else
            gh release create "$tag" dist/Highlighter-*.zip --verify-tag --title "Highlighter $tag" --notes-file packaging/RELEASE_NOTES.md
          fi
      # The in-app updater's files and feed. The app shows the release's own
      # notes, unless they are just the standard install notes.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if ! ls dist/updater/*.sig >/dev/null 2>&1; then
            echo "::warning::No signed update files (is the TAURI_SIGNING_PRIVATE_KEY secret set?): installed apps won't be offered this release."
            exit 0
          fi
          gh release view "$tag" --json body -q .body > notes.md
          if cmp -s <(tr -d '\r' < notes.md | sed -e '$a\') <(sed -e '$a\' packaging/RELEASE_NOTES.md); then : > notes.md; fi
          scripts/updater-manifest.sh "$tag" dist/updater notes.md > dist/updater/latest.json
          cat dist/updater/latest.json
          gh release upload "$tag" dist/updater/* --clobber
